# Runs the same script as local development: scripts/check.py.
#
# Gated today: lockfile in sync, document provenance, formatting, lint (including docstrings
# and the bandit security rules), strict types, tests with an 80% branch-coverage floor
# (including the safe-logging source policy), dependency audit.
#
# Not gated yet, because there is nothing for them to check:
#   - browser tests, accessibility and performance budgets: added with the review UI
#   - model-quality regression on the evaluation set: added with the first extraction baseline
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Check
        run: uv run python scripts/check.py
