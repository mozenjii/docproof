[project]
name = "docproof"
version = "0.0.1"
description = "Field extraction from invoices and freight documents with validation, calibrated confidence and human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mohib Ahmad" }]
dependencies = [
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproof"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# D enforces a docstring on every module and public symbol; S is the bandit security set.
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "D", "S", "PT"]
# S603 fires on every subprocess call made without a shell, so it cannot tell safe from unsafe.
# The rules that do (S602 shell=True, S604, S605 os.system) stay on.
ignore = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are named for the behaviour they check and are not public API; asserts are the point.
"tests/**" = ["D103", "S101", "S311"]
# Benchmark pages and test matrices come from a seeded PRNG on purpose; nothing there is a secret.
"bench/**" = ["S311"]
# Bootstrap resampling must be reproducible from a seed; it draws no secrets.
"src/docproof/scoring.py" = ["S311"]
# Synthetic documents must be reproducible from a seed; they contain no secrets.
"src/docproof/synth/*.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["docproof", "bench"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
source = ["docproof"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
