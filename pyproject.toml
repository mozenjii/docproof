[project]
name = "docproof"
version = "0.0.1"
description = "Field extraction from invoices and freight documents with validation, calibrated confidence and human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mohib Ahmad" }]
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproof"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# D enforces a docstring on every module and public symbol; S is the bandit security set.
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "D", "S", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are named for the behaviour they check and are not public API; asserts are the point.
"tests/**" = ["D103", "S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
