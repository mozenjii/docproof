[project]
name = "docproof"
version = "0.0.1"
description = "Field extraction from invoices and freight documents with validation, calibrated confidence and human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mohib Ahmad" }]
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docproof"]
